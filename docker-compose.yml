services:
  acceptor:
    container_name: quickfix_acceptor
    build:
      context: .
      dockerfile: ./acceptor/Dockerfile
      args:
        WORKING_DIR: ${WORKING_DIR}
        APP_PORT: ${APP_PORT}
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - APP_PORT=${APP_PORT}
    ports:
      - ${APP_PORT}:${APP_PORT}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s = socket.socket(); s.connect(('localhost', $APP_PORT))\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - quickfix
  
  initiator:
    container_name: quickfix_initiator
    build:
      context: .
      dockerfile: ./initiator/Dockerfile
      args:
        WORKING_DIR: ${WORKING_DIR}
    depends_on:
      acceptor:
        condition: service_healthy
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - APP_PORT=${APP_PORT}
    links:
      - acceptor
    networks:
      - quickfix

networks:
  quickfix:


  
